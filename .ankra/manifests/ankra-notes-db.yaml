apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ankra-notes-db
  labels:
    app.kubernetes.io/name: ankra-notes-db
    app.kubernetes.io/managed-by: ankra
spec:
  instances: ${{ ankra.database_instances }}
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  storage:
    size: ${{ ankra.database_storage }}
  bootstrap:
    initdb:
      database: ankra-notes-db
      owner: ankra-notes-db
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: false
