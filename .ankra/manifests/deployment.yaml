apiVersion: apps/v1
kind: Deployment
metadata:
  name: ankra-notes
  labels:
    app.kubernetes.io/name: ankra-notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ankra-notes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ankra-notes
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      imagePullSecrets:
        - name: ankra-registry-pull
      containers:
        - name: ankra-notes
          image: registry.ankra.cloud/org-3b7dccca-0788-4470-9910-19478ae345ae/ankra-notes:${{ ankra.image_tag }}
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PREVIEW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ankra-notes-env
                  key: PREVIEW_API_KEY
                  optional: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir: {}
